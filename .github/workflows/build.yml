name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Build
        id: build
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon 2>&1 | tee build.log
          cp app/build/outputs/apk/release/app-release.apk /tmp/HaloBot.apk

      - name: Report build errors
        if: failure()
        run: |
          grep -E '^e: |error:|What went wrong|Could not find|Could not resolve' -A 2 build.log | head -60 | while IFS= read -r line; do
            [ -n "$line" ] && echo "::error::${line//file:\/\/\/home\/runner\/work\/Alexa\/Alexa\//}"
          done

      - name: Publish build log (for debugging)
        if: always()
        run: |
          git config user.name "halobot-ci"
          git config user.email "ci@users.noreply.github.com"
          mkdir -p /tmp/logs && cp build.log /tmp/logs/ || echo "no log" > /tmp/logs/build.log
          echo "${{ steps.build.outcome }} run=${{ github.run_number }} sha=${{ github.sha }}" > /tmp/logs/status.txt
          git fetch origin ci-logs || true
          git checkout --orphan ci-logs-tmp
          git rm -rf . > /dev/null
          cp /tmp/logs/* .
          git add build.log status.txt
          git commit -m "CI log run ${{ github.run_number }}"
          git push -f origin HEAD:ci-logs

      - name: Release APK
        if: steps.build.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.0.${{ github.run_number }}"
          gh release create "$TAG" /tmp/HaloBot.apk --repo ${{ github.repository }} --target ${{ github.sha }} --title "Halo Bot $TAG" --notes "Install HaloBot.apk on your Android phone. Built from ${{ github.sha }}." --latest
